title: Trust Systems Meta-Model (TSMM)
description: A portable semantic reference model for designing, comparing, and implementing trust systems.
url: https://qbf-consulting.github.io
baseurl: /trust-systems-meta-model
repository: qbf-consulting/trust-systems-meta-model
remote_theme: just-the-docs/just-the-docs@v0.10.1
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
search_enabled: true
heading_anchors: true
color_scheme: light
aux_links:
  "View on GitHub":
    - "https://github.com/qbf-consulting/trust-systems-meta-model"
mermaid:
  version: "11.12.2"

# Publication contract: all documentation pages use the repository's standard
# Just-the-Docs layout unless a page explicitly opts into a different layout.
# Keeping this at the collection/root level prevents a newly added Markdown
# page from silently publishing as unstyled HTML.
defaults:
  - scope:
      path: "docs"
    values:
      layout: default

exclude:
  - vendor/
  - scripts/
  - tests/
  - validation/
  - .github/
  - .bundle/
  - Gemfile
  - Gemfile.lock
  - README.md
  - SECURITY.md
  - SUPPORT.md
  - CONTRIBUTING.md
  - GOVERNANCE.md
  - LICENSE
  - CITATION.cff
  - PROJECT-STATUS.yaml
  - VERSION
  - Makefile
  - requirements-dev.txt
  - artifacts/
