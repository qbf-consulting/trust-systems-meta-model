name: TSMS 2026.2 Historical Release Gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Historical evidence regression
        run: |
          python scripts/validate_tsms_baseline_lineage.py
          python scripts/test_tsms_wire.py
          python scripts/run_tsms_wire.py
          python scripts/run_tsms_e2e.py
          python scripts/test_tsms_e2e.py
          python scripts/run_tsms_2026_2_assurance.py
