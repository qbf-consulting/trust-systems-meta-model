name: TSMS 2026.2 Historical Publication Verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tsms-2026-2-historical-verification
  cancel-in-progress: false

env:
  TAG: tsms-stack-2026.2
  RELEASE_TITLE: TSMS Stack 2026.2 — Alphonso mango
  RELEASE_ISSUE: '52'

jobs:
  verify-historical-publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify immutable predecessor evidence
        run: |
          set -euo pipefail
          python3 scripts/validate_tsms_baseline_lineage.py
          python3 scripts/release_codenames.py validate
          test -s model/tsms-baseline-receipt-2026.2.json
          test -s releases/tsms-stack-2026.2.md
      - name: Verify published historical tag without mutation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh release view "$TAG" --json isDraft --jq '.isDraft')" = false
          test "$(gh release view "$TAG" --json isPrerelease --jq '.isPrerelease')" = false
          published_tag="$(gh release view "$TAG" --json tagName --jq '.tagName')"
          test "$published_tag" = "$TAG"
          gh release view "$TAG" --json url,tagName,name,targetCommitish,isDraft,isPrerelease
          echo "Historical TSMS 2026.2 publication verified without reassigning Latest."
