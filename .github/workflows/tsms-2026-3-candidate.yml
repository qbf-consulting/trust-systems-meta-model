name: TSMS 2026.3 Pre-Acceptance Candidate Archive

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify archived candidate remains explicitly unaccepted
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('model/tsms-baseline-receipt-2026.3.candidate.json').read_text())
          assert x['humanAcceptance']['accepted'] is False
          assert x['status']=='candidate-pending-human-acceptance'
          PY
